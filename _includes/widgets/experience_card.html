<section class="card border-0 shadow-sm bg-white mt-3" aria-label="Education and honors">
    <div class="card-body p-4">
        <div class="row">
            <div class="col-lg-7">
                <h2 class="h6 mb-2">Education</h2>
                {% for item in site.data.profile.education %}
                <div class="d-sm-flex justify-content-between">
                    <strong>{{ item.name }}</strong>
                    <span class="small text-muted d-block ml-sm-2">{{ item.date }}</span>
                </div>
                <p class="small mb-0">
                    {{ item.position }}<br>
                    Minor in {{ item.minor }}<br>
                    CGPA {{ item.cgpa }}
                </p>
                {% endfor %}
            </div>
            <div class="col-lg-5 mt-3 mt-lg-0">
                <h2 class="h6 mb-2">Honors &amp; Awards</h2>
                <ul class="list-unstyled small mb-0">
                    {% for item in site.data.profile.awards %}
                    <li class="{% unless forloop.last %}mb-1{% endunless %}">{{ item.name }} <span class="text-muted">({{ item.date }})</span></li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</section>
